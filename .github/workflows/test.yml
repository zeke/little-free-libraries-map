name: Test OSM spike

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: ./script/test
      - run: ./script/osm-bookcases compare
      - run: git diff --exit-code -- osm/report.json osm/report.md
